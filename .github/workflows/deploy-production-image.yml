name: Build & Push Sales Brain Production Image

# Builds the full app (frontend + backend + orchestrator, with the Sales
# Brain module included) into a single Docker image and pushes it to this
# repository's own GitHub Container Registry namespace. This is separate
# from build-containers.yml (which publishes the upstream gitroomhq image)
# so it never needs credentials beyond the ones GitHub Actions already has
# for this repo.
on:
  push:
    branches:
      - claude/ai-sales-brain-saas-mqw8qo
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/postiz-salesbrain

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
